<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3DDB · Live demo</title>
    <meta name="description" content="A live PostgreSQL database running in your browser, rendered as a 3D datacenter. Click a rack, run SQL, watch it react." />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <script>
      if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
    </script>
    <style>
      html.embed #connection-panel,
      html.embed #legend,
      html.embed #feed,
      html.embed #sql-console,
      html.embed #status-bar,
      html.embed #controls-hint,
      html.embed #notice,
      html.embed .fx-toggle,
      html.embed .fx-panel,
      html.embed #fx-panel {
        display: none !important;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #111518;
        color: #39ff88;
        font: 12px/1.6 'Courier New', Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        transition: opacity 0.9s ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .bar {
        width: 220px;
        height: 1px;
        margin-top: 14px;
        background: #1b7a44;
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #39ff88;
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div>
        <div>Seeding Postgres in your browser</div>
        <div style="color: #1b7a44">18 tables · 14 users · 14 routines</div>
        <div class="bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      window.addEventListener('3d-db:ready', () => {
        const boot = document.getElementById('boot');
        boot.classList.add('gone');
        setTimeout(() => boot.remove(), 1000);
        if (window.parent !== window) window.parent.postMessage('3d-db:ready', '*');
      });
    </script>
    <script type="module" src="../../client/src/main.ts"></script>
  </body>
</html>
